<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEWMAP — Талисман: игровое поле ивента</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <div>
        <div class="brand-title">Талисман</div>
        <div class="brand-sub">игровое поле ивента</div>
      </div>
    </div>
    <div class="turn">
      <span class="turn-label">Ходит:</span>
      <div id="player-chips" class="chips"></div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-stream" title="Скрыть панели (для захвата в OBS). Esc — вернуть">Режим стрима</button>
      <button class="btn" id="btn-settings">Настройки</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel panel-left">
      <h2>Участники</h2>
      <div id="players"></div>
      <button class="btn btn-wide" id="btn-add-player">+ Добавить участника</button>
    </aside>

    <section class="board-wrap">
      <div id="board" class="board"></div>
      <div id="banner" class="banner"></div>
    </section>

    <aside class="panel panel-right">
      <h2>Сложности</h2>
      <div id="legend"></div>
      <h2>Регионы</h2>
      <div id="rings-legend"></div>
      <h2>Журнал</h2>
      <div id="log" class="log"></div>
    </aside>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-x" data-close title="Закрыть">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
